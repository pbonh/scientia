[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scientia"
version = "1.0.0"
description = "Deterministic Python core for the KG-seeded intent-driven Agent Skills pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# networkx is an optional traversal helper only. The pure-Python `neighbors`
# path is canonical; when networkx is present it MUST return identical results
# (ADR-0001, spec kg-wiki-model). Tests are required to pass with it absent.
graph = ["networkx>=3.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["scientia*"]

[tool.setuptools.package-data]
# The pipeline templates + committed config defaults ship with the wheel so
# `references_dir()` can fall back to them when a project has no local override.
scientia = ["references/*.yaml", "references/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
